<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  #logo{width:800px;height:800px;display:block}
</style></head>
<body>
<svg id="logo" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1a0d08"/>
      <stop offset="0.45" stop-color="#0a0608"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="disco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1a00" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#c2360a"/>
      <stop offset="0.35" stop-color="#ff8a1f"/>
      <stop offset="0.5" stop-color="#fff1d6"/>
      <stop offset="0.65" stop-color="#ff8a1f"/>
      <stop offset="0.88" stop-color="#c2360a"/>
      <stop offset="1" stop-color="#7a1a00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0d2"/>
      <stop offset="0.18" stop-color="#ff9a2e"/>
      <stop offset="0.36" stop-color="#c2360a" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#c2360a" stop-opacity="0"/>
      <stop offset="0.64" stop-color="#c2360a" stop-opacity="0.25"/>
      <stop offset="0.82" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="discoFrente" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1a00" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#e04a0c"/>
      <stop offset="0.38" stop-color="#ffd08a"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ff9a2e"/>
      <stop offset="0.85" stop-color="#9e2806"/>
      <stop offset="1" stop-color="#5a1000" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brilhoForte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="fino" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frente"><rect x="0" y="400" width="800" height="400"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#fundo)"/>
  <g id="estrelas" fill="#fff"></g>

  <g transform="rotate(-14 400 400)">
    <!-- brilho difuso geral -->
    <ellipse cx="400" cy="400" rx="300" ry="190" fill="#ff6a10" opacity="0.18" filter="url(#brilhoForte)"/>
    <!-- disco de acreção (parte de trás) -->
    <ellipse cx="400" cy="400" rx="320" ry="58" fill="none" stroke="url(#disco)" stroke-width="30" filter="url(#brilho)" opacity="0.8"/>
    <!-- halo lenteado (luz do disco curvada por cima e por baixo) -->
    <circle cx="400" cy="400" r="172" fill="none" stroke="url(#halo)" stroke-width="46" filter="url(#brilhoForte)" opacity="0.8"/>
    <circle cx="400" cy="400" r="168" fill="none" stroke="url(#halo)" stroke-width="18" filter="url(#brilho)"/>
    <!-- sombra do buraco negro -->
    <circle cx="400" cy="400" r="140" fill="#000"/>
    <!-- anel de fótons -->
    <circle cx="400" cy="400" r="143" fill="none" stroke="#ffe7c2" stroke-width="3" filter="url(#fino)"/>
    <!-- disco de acreção (parte da frente, passa na frente da sombra) -->
    <g clip-path="url(#frente)">
      <ellipse cx="400" cy="400" rx="320" ry="58" fill="none" stroke="url(#discoFrente)" stroke-width="40" filter="url(#brilho)"/>
      <ellipse cx="400" cy="400" rx="320" ry="58" fill="none" stroke="url(#discoFrente)" stroke-width="8" opacity="0.9"/>
    </g>
  </g>
</svg>
<script>
  // estrelas determinísticas (mesmo resultado a cada render)
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const g = document.getElementById('estrelas');
  for (let i = 0; i < 140; i++) {
    const x = r() * 800, y = r() * 800, d = Math.hypot(x - 400, y - 400);
    if (d < 260) continue;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', (r() * 1.4 + 0.3).toFixed(2));
    c.setAttribute('opacity', (r() * 0.7 + 0.2).toFixed(2));
    g.appendChild(c);
  }
</script>
</body></html>
