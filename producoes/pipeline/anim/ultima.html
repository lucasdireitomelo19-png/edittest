<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"MX";src:url("../fonts/Montserrat-ExtraBold.ttf")}
  @font-face{font-family:"MM";src:url("Montserrat-Medium.ttf")}
  html,body{margin:0;background:#070b1a;overflow:hidden}canvas{display:block}
</style>
<script src="geo/topojson-client.min.js"></script>
<script src="geo/land.js"></script>
<script src="geo/paises.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Motion graphics "Você é a última pessoa da Terra" (1920x1080). Helpers iguais aos de mundo.html.
// Cada cena é única. Mapas com dados reais (Natural Earth via world-atlas).
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { bg1: '#070b1a', bg2: '#121a3a', mar: '#0e2a47', mar2: '#0a1f36', terra: '#2c4a5e', terra2: '#3d6178', borda: '#6f90a8',
  laranja: '#f4a261', verm: '#e76f51', ouro: '#ffd166', branco: '#f4f1e8', cinza: '#8a93b8', escuro: '#1b2240', azul: '#4cc9f0',
  magma: '#ff6b2c', rocha: '#5a4636', rocha2: '#3e3027', verde: '#7cc98a', roxo: '#9b7bff' };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const easeOut = x => { x = clamp(x, 0, 1); return 1 - (1 - x) ** 3; };
const back = x => { x = clamp(x, 0, 1); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const RAD = Math.PI / 180;
function rng(seed) { let a = Math.imul(seed + 1, 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const EST = (() => { const r = rng(23), a = []; for (let i = 0; i < 420; i++) a.push([r() * W, r() * H, r() * 1.6 + 0.3, r()]); return a; })();
const fmt = n => Math.round(n).toLocaleString('pt-BR');

function fundo(t, estrelas = 1, c1 = P.bg2, c2 = P.bg1) {
  const g = ctx.createRadialGradient(CX, CY * 0.8, 100, CX, CY, W * 0.75); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (estrelas > 0) for (const [x, y, r, f] of EST) { ctx.globalAlpha = estrelas * (0.25 + 0.35 * Math.abs(Math.sin(t * 0.9 + f * 30)));
    ctx.fillStyle = P.branco; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function vinheta(a = 0.55) {
  const g = ctx.createRadialGradient(CX, CY, H * 0.45, CX, CY, W * 0.68); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function txt(s, x, y, size, cor = P.branco, a = 1, alinh = 'center', fonte = 'MX') {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px ${fonte}`; ctx.textAlign = alinh; ctx.textBaseline = 'middle';
  ctx.fillStyle = cor; ctx.fillText(s, x, y); ctx.restore();
}
function sobe(s, x, y, size, t, t0 = 0, cor = P.branco, alinh = 'center', fonte = 'MX') {
  const e = back((t - t0) / 0.5); if (e <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(e, 0, 1); ctx.translate(0, (1 - e) * 40); txt(s, x, y, size, cor, 1, alinh, fonte); ctx.restore();
}
function pilula(s, x, y, size, fundoCor, cor, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px MX`; const w = ctx.measureText(s).width + size * 1.2, h = size * 1.7;
  ctx.fillStyle = fundoCor; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = cor; ctx.fillText(s, x, y + 2); ctx.restore();
}
function brilho(x, y, r, cor, a = 1) {
  ctx.save(); ctx.globalAlpha = a; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, cor); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function circ(x, y, r, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 6.283); ctx.fill(); }
function anel(x, y, r, cor, lw, a0 = 0, a1 = 6.283) { ctx.strokeStyle = cor; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), a0, a1); ctx.stroke(); }
function flash(t, t0, d = 0.5) { const k = (t - t0) / d; if (k < 0 || k > 1) return; ctx.fillStyle = `rgba(255,250,235,${(1 - k) ** 2})`; ctx.fillRect(0, 0, W, H); }
function pino(x, y, t, rotulo, sub, cor = P.verm) {
  const e = back(t / 0.5); if (e <= 0) return;
  for (let k = 0; k < 2; k++) { const f = ((t * 0.7 + k * 0.5) % 1); anel(x, y, 10 + f * 60, `rgba(231,111,81,${(1 - f) * 0.8})`, 3); }
  ctx.save(); ctx.translate(x, y); ctx.scale(e, e); circ(0, 0, 13, cor); circ(0, 0, 5, P.branco); ctx.restore();
  if (rotulo) { const a = ease((t - 0.3) / 0.4); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = P.branco; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 16, y - 16); ctx.lineTo(x + 70, y - 70); ctx.lineTo(x + 110, y - 70); ctx.stroke(); ctx.restore();
    txt(rotulo, x + 120, y - 74, 46, P.branco, a, 'left'); if (sub) txt(sub, x + 122, y - 30, 30, P.ouro, a, 'left', 'MM'); }
}
// pedra irregular com crateras
function pedra(x, y, R, rot, seed = 3, cor1 = '#6b5d52', cor2 = '#463b33') {
  const r = rng(seed); const pts = []; for (let i = 0; i < 28; i++) pts.push(1 + (r() - 0.5) * 0.28);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-R * 0.35, -R * 0.35, R * 0.1, 0, 0, R * 1.1); g.addColorStop(0, cor1); g.addColorStop(1, cor2);
  ctx.fillStyle = g; ctx.beginPath(); pts.forEach((k, i) => { const a = i / 28 * 6.283; const px = Math.cos(a) * R * k, py = Math.sin(a) * R * k * 0.86; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 7; i++) { const a = r() * 6.283, d = r() * 0.6 * R, rr = R * (0.06 + r() * 0.1); circ(Math.cos(a) * d, Math.sin(a) * d * 0.86, rr, 'rgba(0,0,0,0.22)'); }
  ctx.restore();
}

// ---------------- geografia ----------------
const LAND = topojson.feature(TOPO_LAND, TOPO_LAND.objects.land);
const FRONT = topojson.mesh(TOPO_PAISES, TOPO_PAISES.objects.countries, (a, b) => a !== b);
const polys = []; for (const f of (LAND.features || [LAND])) { const g = f.geometry || f; if (g.type === 'Polygon') polys.push(g.coordinates); else for (const c of g.coordinates) polys.push(c); }
const merc = lat => Math.log(Math.tan(Math.PI / 4 + clamp(lat, -85, 85) * RAD / 2)) / RAD;
// mapa Mercator: centro (lon0, lat0), k = px por grau
function mapa(lon0, lat0, k, opc = {}) {
  const pr = (lon, lat) => [CX + (lon - lon0) * k, CY - (merc(lat) - merc(lat0)) * k];
  ctx.fillStyle = opc.mar || P.mar2; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = 'rgba(120,150,190,0.12)'; ctx.lineWidth = 1;
  const passo = k > 40 ? 5 : k > 12 ? 10 : 20;
  for (let L = -180; L <= 180; L += passo) { const [x] = pr(L, 0); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let L = -80; L <= 80; L += passo) { const [, y] = pr(0, L); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  const p = new Path2D();
  for (const poly of polys) for (const ring of poly) { let prev = null; ring.forEach(([lon, lat], i) => {
    const [x, y] = pr(lon, lat); (i && Math.abs(lon - prev) < 180) ? p.lineTo(x, y) : p.moveTo(x, y); prev = lon; }); p.closePath(); }
  ctx.fillStyle = opc.terra || P.terra; ctx.fill(p);
  ctx.strokeStyle = opc.costa || P.borda; ctx.lineWidth = 1.4; ctx.stroke(p);
  if (opc.fronteiras !== false) { ctx.save(); ctx.strokeStyle = 'rgba(200,220,240,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const line of FRONT.coordinates) line.forEach(([lon, lat], i) => { const [x, y] = pr(lon, lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.restore(); }
  return pr;
}
// zoom suave de mapa: de (lon,lat,k) para (lon,lat,k)
function mapaZoom(t, a, b, d = 2.6, opc) { const e = ease(t / d); const k = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), e));
  return mapa(lerp(a[0], b[0], e), lerp(a[1], b[1], e), k, opc); }
// globo ortográfico
function globo(cx, cy, R, lon0, lat0, opc = {}) {
  const f0 = lat0 * RAD;
  const pr = (lon, lat) => { const l = (lon - lon0) * RAD, f = lat * RAD;
    const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l);
    let x = Math.cos(f) * Math.sin(l), y = Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l);
    if (cosc < 0) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; }
    return [cx + x * R, cy - y * R, cosc >= 0]; };
  const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  g.addColorStop(0, opc.mar1 || '#1d5a85'); g.addColorStop(1, opc.mar2 || '#0b2440');
  circ(cx, cy, R, g);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.clip();
  const p = new Path2D();
  for (const poly of polys) for (const ring of poly) { let alguma = false; const pts = ring.map(([lo, la]) => { const q = pr(lo, la); if (q[2]) alguma = true; return q; });
    if (!alguma) continue; pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); }
  ctx.fillStyle = opc.terra || '#3f7a5a'; ctx.fill(p);
  const s = ctx.createRadialGradient(cx - R * 0.4, cy - R * 0.4, R * 0.2, cx, cy, R * 1.05);
  s.addColorStop(0, 'rgba(255,255,255,0.08)'); s.addColorStop(0.7, 'rgba(0,0,0,0)'); s.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = s; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); ctx.restore();
  anel(cx, cy, R + 4, opc.atm || 'rgba(120,200,255,0.35)', 8);
  return pr;
}
// silhueta de cidade
function cidade(base, seed, cor, alt = 1, x0 = 0, x1 = W) {
  const r = rng(seed); ctx.fillStyle = cor; let x = x0;
  while (x < x1) { const w = 30 + r() * 70, h = (40 + r() * 160 + (r() < 0.12 ? 160 : 0)) * alt; ctx.fillRect(x, base - h, w - 4, h); x += w; }
  ctx.fillRect(x0, base, x1 - x0, H - base);
}
// camadas de rocha em corte
function estratos(y0, t) {
  const cores = ['#6b5340', '#5c4636', '#4c3a2e', '#3f3027', '#332720'];
  for (let i = 0; i < 5; i++) { ctx.fillStyle = cores[i]; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, y0 + i * 95 + Math.sin(x * 0.004 + i) * 14); ctx.lineTo(W, H); ctx.fill(); }
}
function grama(y, cor = '#2e4a2c') { ctx.fillStyle = cor; ctx.fillRect(0, y - 10, W, 14); }

// ---------------- cenas ----------------
function globoMini(x, y, R, t) { const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.3, 2, x, y, R); g.addColorStop(0, '#5fb0e0'); g.addColorStop(1, '#123a66'); circ(x, y, R, g);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.clip(); ctx.fillStyle = '#4f9a6a'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x + Math.sin(t * 0.5 + i * 1.7) * R * 0.6, y + (i - 1.5) * R * 0.45, R * 0.35, R * 0.18, i, 0, 6.283); ctx.fill(); } ctx.restore(); }
function galaxia(x, y, R, t, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(t * 0.1); ctx.scale(1, 0.55);
  for (let i = 0; i < 380; i++) { const r = rng(i + 77), br = i % 2, rr = Math.sqrt(r()) * R, an = rr / R * 5 + br * Math.PI + (r() - 0.5) * 0.7; circ(Math.cos(an) * rr, Math.sin(an) * rr, 1.4 + r() * 1.6, `rgba(${200 + r() * 55},${200 + r() * 40},255,${0.5 + r() * 0.4})`); }
  brilho(0, 0, R * 0.4, 'rgba(255,240,210,0.9)'); ctx.restore(); }
const CENAS = {};
const LAR = '#ff8a3d';
function fundoU(c1 = '#1a1430', c2 = '#05040c') { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function pessoa(x, y, s, cor) { circ(x, y - 46 * s, 20 * s, cor); ctx.fillStyle = cor; ctx.beginPath(); ctx.roundRect(x - 22 * s, y - 22 * s, 44 * s, 70 * s, 18 * s); ctx.fill(); }
function titulo2(a, b, t, cor = P.branco, cor2 = LAR) { sobe(a, CX, 150, 64, t, 0.1, cor); if (b) txt(b, CX, 215, 32, cor2, ease((t - 0.3) / 0.4), 'center', 'MM'); }

// ---------- GANCHO ----------
CENAS.u_despertador = (t, d) => {   // quarto ao amanhecer, despertador tocando
  fundoU('#2b1f3d', '#0c0816'); ctx.fillStyle = '#ffb36b'; ctx.globalAlpha = 0.25; ctx.fillRect(1250, 120, 480, 560); ctx.globalAlpha = 1;
  ctx.strokeStyle = '#3d2f52'; ctx.lineWidth = 16; ctx.strokeRect(1250, 120, 480, 560); ctx.beginPath(); ctx.moveTo(1490, 120); ctx.lineTo(1490, 680); ctx.moveTo(1250, 400); ctx.lineTo(1730, 400); ctx.stroke();
  ctx.fillStyle = '#2a2038'; ctx.fillRect(300, 760, 700, 320); const tr = t < 1.4 ? Math.sin(t * 70) * 7 : 0;
  ctx.save(); ctx.translate(650 + tr, 600); circ(0, 0, 150, '#f4f1e8'); anel(0, 0, 150, LAR, 14); circ(-110, -130, 38, LAR); circ(110, -130, 38, LAR);
  ctx.strokeStyle = '#1b1b2a'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -95); ctx.moveTo(0, 0); ctx.lineTo(65, 25); ctx.stroke(); ctx.restore();
  if (t < 1.4) for (let k = 0; k < 3; k++) { anel(650, 600, 190 + k * 40 + (t * 120) % 40, `rgba(255,138,61,${0.5 - k * 0.15})`, 4, -2.4, -0.7); }
  txt('07:00', 650, 860, 70, P.branco); };
CENAS.u_mapa_vazio = (t, d) => {   // mapa da cidade sem nenhum ponto se mexendo
  ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = '#1e2a40'; ctx.lineWidth = 10;
  for (let x = -100; x < W + 100; x += 160) { ctx.beginPath(); ctx.moveTo(x + 40, 0); ctx.lineTo(x - 40, H); ctx.stroke(); } for (let y = 60; y < H; y += 140) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + 30); ctx.stroke(); }
  ctx.strokeStyle = '#2c3d5c'; ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(0, 540); ctx.lineTo(W, 600); ctx.stroke();
  const k = ease(t / 1.2); for (let i = 0; i < 60; i++) { const r = rng(i + 3); circ(r() * W, r() * H, 7, `rgba(255,209,102,${0.8 * (1 - k)})`); }
  pilula('0 CARROS · 0 PESSOAS', CX, 160, 48, LAR, '#1b0f05', ease((t - 1.0) / 0.4)); };
CENAS.u_celular = (t, d) => {   // celular sem mensagens, sem notificação
  fundoU('#20172e', '#07050c'); ctx.save(); ctx.translate(CX, 560); ctx.rotate(-0.05 + Math.sin(t) * 0.02);
  ctx.fillStyle = '#101018'; ctx.beginPath(); ctx.roundRect(-230, -420, 460, 840, 60); ctx.fill(); ctx.strokeStyle = '#3a3a55'; ctx.lineWidth = 8; ctx.stroke();
  txt('07:01', 0, -270, 96, P.branco); txt('quarta-feira', 0, -190, 30, P.cinza, 1, 'center', 'MM');
  for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.roundRect(-190, -110 + i * 120, 380, 96, 20); ctx.fill(); }
  txt('0', 0, 10, 160, LAR, ease((t - 0.4) / 0.4)); txt('MENSAGENS NOVAS', 0, 120, 34, P.branco, ease((t - 0.6) / 0.4)); ctx.restore(); };
CENAS.u_chamando = (t, d) => {   // ligação para a família sem resposta
  fundoU('#16121f', '#05040a'); const r = 120; circ(CX, 420, r, '#2c2440'); pessoa(CX, 470, 1.6, '#4a3e66');
  for (let k = 0; k < 3; k++) { const f = (t * 0.8 + k / 3) % 1; anel(CX, 420, r + f * 220, `rgba(255,138,61,${0.6 * (1 - f)})`, 4); }
  txt('MÃE', CX, 640, 70, P.branco); txt('chamando' + '.'.repeat(1 + Math.floor(t * 2) % 3), CX, 710, 36, P.cinza, 1, 'center', 'MM');
  circ(CX - 160, 850, 50, '#e63946'); circ(CX + 160, 850, 50, '#2a8a4a'); txt('SEM RESPOSTA', CX, 950, 34, '#e63946', ease((t - 1.6) / 0.3), 'center', 'MM'); };
CENAS.u_contador = (t, d) => {   // 8 bilhões → 1
  fundo(t, 0.9, '#121a3c', '#03040c'); globo(560, CY + 40, 360, -30 + t * 6, 15);
  for (let i = 0; i < 220; i++) { const r = rng(i + 40), a = r() * 6.283, rr = Math.sqrt(r()) * 330; if (r() > ease((t - 0.4) / 2)) circ(560 + Math.cos(a) * rr, CY + 40 + Math.sin(a) * rr, 4, 'rgba(255,209,102,0.95)'); }
  const n = Math.max(1, Math.round(8e9 * (1 - ease((t - 0.4) / 2)))); txt(n === 1 ? '1' : fmt(n), 1400, 470, n === 1 ? 300 : 110, n === 1 ? LAR : P.branco); txt('PESSOAS NA TERRA', 1400, 660, 40, P.cinza, 1, 'center', 'MM'); };
CENAS.u_titulo = (t, d) => {   // título do vídeo
  fundo(t, 0.7, '#1c1430', '#04030a'); const e = back(t / 0.6); pessoa(CX, 760 + (1 - clamp(e, 0, 1)) * 40, 2.2, '#000'); brilho(CX, 900, 500, 'rgba(255,138,61,0.25)');
  sobe('A ÚLTIMA PESSOA', CX, 300, 110, t, 0.2); sobe('DA TERRA', CX, 420, 110, t, 0.35, LAR); sobe('HORA POR HORA, ATÉ O FIM', CX, 520, 36, t, 0.6, P.cinza, 'center', 'MM'); };

// ---------- CARTÃO DE CAPÍTULO ----------
CENAS.u_cap = (t, d, p) => {
  fundoU(p.c1 || '#2a1730', '#050308'); const r = rng(p.seed || 3); for (let i = 0; i < 90; i++) { const x = r() * W, y = (r() * H - t * (20 + r() * 40)) % H; circ(x, (y + H) % H, r() * 2.5 + 0.5, `rgba(255,${180 + r() * 60},120,${0.15 + r() * 0.3})`); }
  if (p.glitch && t < 0.5) for (let i = 0; i < 14; i++) { const q = rng(i + Math.floor(t * 30)); ctx.fillStyle = `rgba(${q() < 0.5 ? '255,138,61' : '76,201,240'},${0.35 * q()})`; ctx.fillRect(0, q() * H, W, 8 + q() * 50); }
  const k = easeOut((t - 0.2) / 0.6); ctx.fillStyle = p.cor || LAR; ctx.fillRect(CX - 420 * k, CY + 60, 840 * k, 6);
  sobe(p.titulo, CX, CY - 40, 170, t, 0.1, P.branco); sobe(p.sub || '', CX, CY + 130, 44, t, 0.45, p.cor || LAR, 'center', 'MM'); vinheta(0.6); };

// ---------- HORA 1 ----------
CENAS.u_mundo_seu = (t, d) => {   // mapa-múndi real acendendo em laranja
  const pr = mapa(-20, 20, 5.2, { mar: '#120a10', terra: '#3a1c10', costa: LAR, fronteiras: false }); const k = ease((t - 0.2) / 1.6);
  ctx.fillStyle = `rgba(255,138,61,${0.25 * k})`; ctx.fillRect(0, 0, W, H); sobe('O MUNDO INTEIRO É SEU', CX, 200, 80, t, 0.4, P.branco); vinheta(0.5); };
CENAS.u_carrinho = (t, d) => {   // carrinho enchendo, etiquetas R$ 0
  fundoU('#3a1d10', '#120806'); const cores = ['#ff8a3d', '#ffd166', '#e76f51', '#7cc98a', '#4cc9f0', '#9b7bff'];

  for (let i = 0; i < 20; i++) { const r = rng(i + 4), x = 360 + r() * 1200, y = 250 - ((t * 120 + r() * 200) % 200); ctx.strokeStyle = 'rgba(90,170,240,0.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 20); ctx.stroke(); }

CENAS.u_colina = (t, d) => {   // cidade virando colina de floresta
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6a8aa0'); g.addColorStop(1, '#2a3a30'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); const k = ease((t - 0.2) / (d - 0.4));
  for (let i = 0; i < 14; i++) { const r = rng(i + 50), x = 80 + i * 130, h = (200 + r() * 420) * (1 - 0.75 * k); ctx.fillStyle = `rgb(${lerp(80, 50, k)},${lerp(85, 90, k)},${lerp(95, 60, k)})`; ctx.fillRect(x, 860 - h, 110, h); }
  ctx.fillStyle = '#3e6a3a'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 860 - 260 * k * (0.6 + 0.4 * Math.sin(x * 0.006))); ctx.lineTo(W, H); ctx.fill();
  for (let i = 0; i < 70 * k; i++) { const r = rng(i + 800), x = r() * W, y = 860 - 260 * k * (0.6 + 0.4 * Math.sin(x * 0.006)); circ(x, y - 20, 22 + r() * 18, r() < 0.5 ? '#4f7a3e' : '#5f8a4c'); }
  txt('ALGUNS SÉCULOS DEPOIS', CX, 130, 60, P.branco); };
CENAS.u_plastico = (t, d) => {   // alguns plásticos também ficam
  fundoU('#14181c', '#050607'); ctx.save(); ctx.translate(CX, 560); ctx.rotate(Math.sin(t) * 0.1); ctx.fillStyle = 'rgba(160,210,240,0.35)'; ctx.strokeStyle = 'rgba(200,230,255,0.8)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.roundRect(-90, -200, 180, 380, 40); ctx.fill(); ctx.stroke(); ctx.fillRect(-40, -270, 80, 70); ctx.fillStyle = '#4cc9f0'; ctx.fillRect(-50, -290, 100, 30); ctx.restore(); txt('E ALGUNS PLÁSTICOS TAMBÉM', CX, 140, 60, P.branco, ease((t - 0.2) / 0.4)); };
CENAS.u_pegada = (t, d) => {   // pegada na Lua: milhões de anos
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); for (const [x, y, r, f] of EST) if (y < 300) circ(x, y, r, `rgba(255,255,255,${0.3 + 0.5 * f})`);
  const g = ctx.createLinearGradient(0, 300, 0, H); g.addColorStop(0, '#7a7a7a'); g.addColorStop(1, '#3a3a3a'); ctx.fillStyle = g; ctx.fillRect(0, 300, W, 780);
  ctx.save(); ctx.translate(CX, 700); ctx.scale(1, 0.55); ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.roundRect(-140, -380, 280, 760, 140); ctx.fill(); ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = 10;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(-120, i * 55); ctx.lineTo(120, i * 55); ctx.stroke(); } ctx.restore(); const n = Math.round(1 + 999 * easeOut((t - 0.4) / 1.6));
  txt('SEM VENTO · SEM CHUVA', CX, 140, 50, P.branco); txt(fmt(n) + '.000 ANOS (OU MAIS)', CX, 230, 56, P.ouro, ease((t - 0.4) / 0.4)); };
CENAS.u_voyager = (t, d) => {   // Voyager com o disco de ouro, saindo do Sistema Solar
  fundo(t, 1, '#060818', '#000'); const x = lerp(1500, 600, ease(t / d)), y = 520; ctx.save(); ctx.translate(x, y); ctx.rotate(-0.2);
  ctx.strokeStyle = '#c9c2b5'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-260, 120); ctx.moveTo(0, 0); ctx.lineTo(220, 160); ctx.stroke(); ctx.fillStyle = '#e8e2d4'; ctx.beginPath(); ctx.ellipse(0, -60, 170, 60, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#8a8070'; ctx.fillRect(-50, -10, 100, 80); circ(0, 30, 26, P.ouro); ctx.restore(); circ(1800, 300, 10, P.ouro); txt('SOL', 1800, 340, 24, P.ouro, 1, 'center', 'MM');
  txt('VOYAGER', CX, 130, 60, P.branco, ease((t - 0.3) / 0.4)); txt('FORA DO SISTEMA SOLAR', CX, 200, 32, P.cinza, ease((t - 0.5) / 0.4), 'center', 'MM'); };
CENAS.u_disco = (t, d) => {   // disco de ouro girando
  fundo(t, 0.8, '#0c0a14', '#000'); ctx.save(); ctx.translate(CX, CY); ctx.rotate(t * 0.6); const g = ctx.createRadialGradient(-80, -80, 20, 0, 0, 360); g.addColorStop(0, '#ffe7a0'); g.addColorStop(1, '#b07a20'); circ(0, 0, 360, g);
  for (let i = 0; i < 18; i++) anel(0, 0, 100 + i * 14, 'rgba(120,80,20,0.35)', 2); circ(0, 0, 80, '#8a5a10'); circ(0, 0, 14, '#000'); ctx.restore(); brilho(CX - 120, CY - 140, 200, 'rgba(255,255,255,0.25)');
  txt('SONS E IMAGENS DA TERRA', CX, 110, 56, P.branco, ease((t - 0.3) / 0.4)); txt('1977', CX, 970, 40, P.ouro, ease((t - 0.6) / 0.4)); };

// ---------- FINAL ----------
CENAS.u_rebobina = (t, d) => {   // espera: tudo rebobina
  ctx.fillStyle = '#05060c'; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 12; i++) { const r = rng(i + Math.floor(t * 20)); ctx.fillStyle = `rgba(76,201,240,${0.2 * r()})`; ctx.fillRect(0, r() * H, W, 4 + r() * 30); }
  ctx.fillStyle = P.branco; for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.moveTo(CX - 40 - k * 140, CY); ctx.lineTo(CX + 80 - k * 140, CY - 100); ctx.lineTo(CX + 80 - k * 140, CY + 100); ctx.fill(); } txt('ESPERA…', CX, 820, 60, P.azul); };
CENAS.u_sobe = (t, d) => {   // câmera sobe da Terra escura até a órbita
  const k = ease(t / d); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); for (const [x, y, r, f] of EST) circ(x, y, r, `rgba(255,255,255,${(0.2 + 0.5 * f) * k})`);
  const R = lerp(6000, 700, k); globo(CX, lerp(H + R - 300, 1500, k), R, -50, 20, { mar1: '#0a1a2e', mar2: '#02060e', terra: '#121c22', atm: 'rgba(90,150,220,0.55)' });
  txt('AINDA TINHA GENTE FORA DELE', CX, 140, 56, P.branco, ease((t - 0.6) / 0.4)); };
CENAS.u_cupula = (t, d) => {   // janelas da cúpula da ISS com silhuetas olhando a Terra escura
  ctx.fillStyle = '#0c0e14'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, 400, 0, 6.283); ctx.clip(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  globo(CX, CY + 380, 560, -40 + t * 4, 10, { mar1: '#06101c', mar2: '#010306', terra: '#0b1218', atm: 'rgba(80,140,220,0.5)' }); ctx.restore();
  ctx.strokeStyle = '#3a3e48'; ctx.lineWidth = 30; ctx.beginPath(); ctx.arc(CX, CY, 400, 0, 6.283); ctx.stroke(); for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283; ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * 160, CY + Math.sin(a) * 160); ctx.lineTo(CX + Math.cos(a) * 400, CY + Math.sin(a) * 400); ctx.stroke(); } anel(CX, CY, 160, '#3a3e48', 24);
  pessoa(CX - 470, 900, 2.2, '#000'); pessoa(CX + 480, 920, 2.0, '#000'); txt('A 400 KM DE ALTURA', CX, 70, 44, P.branco, ease((t - 0.3) / 0.4), 'center', 'MM'); };
CENAS.u_capsula = (t, d) => {   // cápsula acoplada se soltando para voltar
  fundo(t, 1, '#060818', '#000'); globo(CX, 1700, 1000, -40, 20, { mar1: '#06101c', mar2: '#010306', terra: '#0b1218', atm: 'rgba(80,140,220,0.5)' });
  ctx.fillStyle = '#c9c2b5'; ctx.fillRect(300, 380, 900, 120); ctx.fillStyle = '#2a3a6a'; ctx.fillRect(320, 220, 260, 120); ctx.fillRect(320, 540, 260, 120); const k = ease((t - 0.5) / (d - 0.7)), x = 1200 + 300 * k;
  ctx.fillStyle = '#f4f1e8'; ctx.beginPath(); ctx.moveTo(x, 390); ctx.lineTo(x + 180, 360); ctx.lineTo(x + 180, 520); ctx.lineTo(x, 490); ctx.fill(); txt('ELES TÊM COMO VOLTAR', CX, 110, 56, P.branco, ease((t - 0.2) / 0.4)); };
CENAS.u_voz = (t, d) => {   // a primeira voz em meses: onda sonora voltando
  ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, W, H); const k = ease((t - 0.3) / 1.2); ctx.strokeStyle = P.azul; ctx.lineWidth = 6; ctx.beginPath();
  for (let x = 120; x <= W - 120; x += 6) { const e = Math.sin((x - 120) / (W - 240) * Math.PI); const y = CY + (Math.sin(x * 0.04 + t * 10) * 90 + Math.sin(x * 0.013 - t * 6) * 60) * k * e; x > 120 ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  brilho(CX, CY, 500 * k, 'rgba(76,201,240,0.18)'); txt('OUTRA VOZ HUMANA', CX, 200, 64, P.branco, ease((t - 0.8) / 0.4)); };
CENAS.u_bolha = (t, d) => {   // bolha de rádio: +100 anos-luz
  fundo(t, 1, '#060818', '#000'); const R = 60 + 290 * easeOut((t - 0.2) / 1.8); brilho(CX, CY, R * 1.2, 'rgba(76,201,240,0.12)'); anel(CX, CY, R, 'rgba(76,201,240,0.85)', 4);
  for (let i = 1; i < 4; i++) anel(CX, CY, R * i / 4, 'rgba(76,201,240,0.25)', 2); circ(CX, CY, 8, P.azul); txt('+100 ANOS-LUZ', CX + R * 0.7 + 40, CY - R * 0.7, 46, P.branco, ease((t - 1.2) / 0.4), 'left');
  txt('VOZES HUMANAS VIAJANDO PELO ESPAÇO', CX, 110, 50, P.azul, ease((t - 0.3) / 0.4)); };
CENAS.u_final = (t, d) => {   // a Terra pequena e azul se afastando
  fundo(t, 1, '#060a1a', '#000'); const R = lerp(320, 80, ease(t / d)); globoMini(CX, CY, R, t); brilho(CX, CY, R * 2, 'rgba(76,201,240,0.25)');
  sobe('QUANDO NÃO SOBRA NINGUÉM', CX, 820, 52, t, 1.0, P.branco); sobe('PRA DIVIDIR', CX, 900, 52, t, 1.2, P.azul); };

// THUMBNAIL (1920x1080 → 1280x720): silhueta sozinha numa avenida vazia ao entardecer
CENAS.u_thumb = (t, d) => {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a1a3a'); g.addColorStop(0.45, '#e0603a'); g.addColorStop(0.6, '#ffb36b'); g.addColorStop(0.61, '#1a1418'); g.addColorStop(1, '#0a0608'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  circ(CX, 640, 130, '#ffe0b0'); brilho(CX, 640, 600, 'rgba(255,170,90,0.55)');
  for (let i = 0; i < 22; i++) { const r = rng(i + 5), lado = i < 11 ? -1 : 1, k = i % 11, x = CX + lado * (180 + k * 90), h = 260 + r() * 420 - k * 6; ctx.fillStyle = '#120c14'; ctx.fillRect(x - (lado > 0 ? 0 : 80), 650 - h, 80, h); }
  ctx.fillStyle = '#2a1e22'; ctx.beginPath(); ctx.moveTo(CX - 60, 650); ctx.lineTo(CX + 60, 650); ctx.lineTo(W + 400, H); ctx.lineTo(-400, H); ctx.fill();
  for (let i = 0; i < 7; i++) { const f = i / 7, y = 650 + f * f * 430, w = 4 + f * 26; ctx.fillStyle = '#ffd166'; ctx.fillRect(CX - w / 2, y, w, 6 + f * 50); }
  ctx.fillStyle = '#000'; circ(CX + 120, 760, 26, '#000'); ctx.beginPath(); ctx.roundRect(CX + 92, 790, 56, 130, 22); ctx.fill(); ctx.fillRect(CX + 98, 900, 18, 90); ctx.fillRect(CX + 124, 900, 18, 90);
  vinheta(0.55); ctx.save(); ctx.font = '230px MX'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = 26; ctx.strokeStyle = '#000'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 30;
  ctx.strokeText('SÓ', 80, 300); ctx.strokeText('VOCÊ', 80, 520); ctx.shadowBlur = 0; ctx.fillStyle = P.branco; ctx.fillText('SÓ', 80, 300); ctx.fillStyle = P.ouro; ctx.fillText('VOCÊ', 80, 520); ctx.restore();
};

window.desenhar = (cena, t, dur, p) => { p = p || {}; ctx.save(); ctx.clearRect(0, 0, W, H); if (p.sat !== undefined) ctx.filter = `saturate(${p.sat})`; CENAS[cena](t, dur, p); ctx.restore(); };
window.CENAS = CENAS;
</script>
