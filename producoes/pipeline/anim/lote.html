<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"MX";src:url("../fonts/Montserrat-ExtraBold.ttf")}
  @font-face{font-family:"MM";src:url("Montserrat-Medium.ttf")}
  html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Animações verticais (1080x1920) do lote viral 01. window.desenhar(cena, t, dur, p).
// Cenas: tamanho (Betelgeuse x órbitas), curva (curva de luz), espectro (sinal estreito), degrau (vácuo falso),
// bolha (vácuo verdadeiro apagando o céu), orbitas (Planeta Nove), ritmo (rajadas com ciclo), vazio (Boötes), dyson.
const W = 1080, H = 1920, CX = W / 2, CY = H / 2 - 120;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const ESTRELAS = (() => { const r = rng(7), a = [];
  for (let i = 0; i < 1100; i++) a.push([r() * W, r() * H, r() ** 3 * 2.2 + 0.4, r()]); return a; })();
function ceu(t, alpha = 1) {
  const g = ctx.createRadialGradient(CX, CY, 50, CX, CY, H);
  g.addColorStop(0, '#0b1222'); g.addColorStop(1, '#010206'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, f] of ESTRELAS) { ctx.globalAlpha = alpha * (0.45 + 0.55 * Math.abs(Math.sin(t * 1.3 + f * 40)));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function brilho(x, y, r, cor, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, cor); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
}
function rotulo(txt, x, y, size = 34, cor = '#dfe8ff', alinh = 'center', a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px MX`; ctx.textAlign = alinh; ctx.textBaseline = 'middle';
  ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.strokeText(txt, x, y); ctx.fillStyle = cor; ctx.fillText(txt, x, y); ctx.restore();
}
function estrela(x, y, r, c1, c2, t, a = 1) {
  brilho(x, y, r * 3.2, c2, 0.5 * a);
  const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
  g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.globalAlpha = a; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
}

const CENAS = {
  // Betelgeuse no lugar do Sol: cresce até passar da órbita de Marte (raio ~3,5 UA)
  tamanho(t, d, p) {
    ceu(t, 0.6);
    const UA = 84, k = ease((t - 0.4) / (d * 0.7));
    const orbs = [['MERCÚRIO', 0.39], ['VÊNUS', 0.72], ['TERRA', 1.0], ['MARTE', 1.52], ['JÚPITER', 5.2]];
    ctx.lineWidth = 3;
    orbs.forEach(([n, a], i) => {
      const r = a * UA; ctx.strokeStyle = `rgba(160,200,255,${i === 4 ? 0.35 : 0.55})`;
      ctx.beginPath(); ctx.arc(CX, CY, r, 0, 6.283); ctx.stroke();
      const ang = t * (0.9 / Math.sqrt(a ** 3)) + i * 1.3, px = CX + Math.cos(ang) * r, py = CY + Math.sin(ang) * r;
      const engolido = 3.5 * UA * k > r;
      ctx.fillStyle = engolido ? 'rgba(255,120,60,0.0)' : '#cfe3ff'; ctx.beginPath(); ctx.arc(px, py, 7, 0, 6.283); ctx.fill();
      if (!engolido && i < 4) rotulo(n, px, py - 30, 24, '#cfe3ff');
    });
    const rB = lerp(5, 3.5 * UA, k);
    estrela(CX, CY, rB, '#ffb070', '#c2361a', t, 0.95);
    // turbulência na superfície
    const r = rng(3); ctx.globalAlpha = 0.25 * k;
    for (let i = 0; i < 40; i++) { const a = r() * 6.283, dd = r() * rB * 0.85; brilho(CX + Math.cos(a + t * 0.1) * dd, CY + Math.sin(a + t * 0.1) * dd, rB * 0.18, '#ffd2a0', 0.35); }
    ctx.globalAlpha = 1;
    if (k < 0.15) estrela(CX, CY, 9, '#fffbe0', '#ffc94a', t);
    rotulo(k < 0.2 ? 'SOL' : 'BETELGEUSE', CX, CY + rB + 60, 44, k < 0.2 ? '#ffe28a' : '#ff9a6a');
    rotulo('JÚPITER', CX, CY - 5.2 * UA - 30, 26, '#9fb8e0');
  },
  // curva de luz: estrela no alto e gráfico do brilho sendo desenhado; p.tipo = 'planeta' | 'tabby'
  curva(t, d, p) {
    ceu(t, 0.5);
    const tipo = p.tipo || 'tabby', k = clamp(t / (d * 0.9), 0, 1);
    const f = x => { // brilho relativo (1 = normal) ao longo do tempo x (0..1)
      if (tipo === 'planeta') { const ph = (x * 4) % 1; return Math.abs(ph - 0.5) < 0.03 ? 0.99 : 1; }
      const dip = (c, w, a) => a * Math.exp(-Math.pow((x - c) / w, 2));
      return 1 - dip(0.22, 0.012, 0.15) - dip(0.31, 0.02, 0.05) - dip(0.55, 0.008, 0.22) - dip(0.58, 0.015, 0.08) - dip(0.8, 0.025, 0.11) - dip(0.86, 0.01, 0.06);
    };
    const b = f(k);
    // estrela com o "eclipse" de uma nuvem irregular
    const sx = CX, sy = 470, sr = 150;
    estrela(sx, sy, sr, '#fff6dc', '#ffcf6a', t, 0.4 + 0.6 * b ** 3);
    if (tipo === 'tabby' && b < 0.97) { ctx.globalAlpha = (1 - b) * 3.5; ctx.fillStyle = '#080604';
      const r = rng(Math.floor(k * 40)); for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.ellipse(sx + (r() - 0.5) * sr * 1.4, sy + (r() - 0.5) * sr * 1.2, 30 + r() * 70, 18 + r() * 40, r(), 0, 6.283); ctx.fill(); } ctx.globalAlpha = 1; }
    if (tipo === 'planeta') { const ph = (k * 4) % 1, px = sx + (ph - 0.5) * sr * 8; ctx.fillStyle = '#05070c'; ctx.beginPath(); ctx.arc(px, sy, 22, 0, 6.283); ctx.fill(); }
    // gráfico
    const gx = 90, gy = 880, gw = W - 180, gh = 560;
    ctx.fillStyle = 'rgba(10,16,30,0.75)'; ctx.fillRect(gx - 20, gy - 40, gw + 40, gh + 100);
    ctx.strokeStyle = 'rgba(160,190,255,0.25)'; ctx.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { const y = gy + gh * i / 4; ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + gw, y); ctx.stroke(); }
    const yOf = v => gy + (1 - v) / 0.25 * gh;
    ctx.strokeStyle = tipo === 'tabby' ? '#ffd24a' : '#7fd0ff'; ctx.lineWidth = 6; ctx.beginPath();
    for (let i = 0; i <= 400 * k; i++) { const x = i / 400, y = yOf(f(x)); if (i === 0) ctx.moveTo(gx + x * gw, y); else ctx.lineTo(gx + x * gw, y); }
    ctx.stroke();
    rotulo('100%', gx - 10, yOf(1) - 22, 26, '#9fb8e0', 'left'); rotulo('75%', gx - 10, yOf(0.75) + 30, 26, '#9fb8e0', 'left');
    rotulo('BRILHO DA ESTRELA', CX, gy + gh + 30, 30, '#9fb8e0');
    if (tipo === 'tabby' && k > 0.56) rotulo('-22%', gx + 0.55 * gw + 60, yOf(0.78), 54, '#ff6a4a', 'left');
    if (tipo === 'planeta') rotulo('-1%', gx + gw * 0.62, yOf(0.99) - 50, 48, '#7fd0ff');
  },
  // espectrograma (cascata): ruído com uma linha estreita e brilhante numa única frequência
  espectro(t, d, p) {
    ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, W, H);
    const gx = 60, gy = 260, gw = W - 120, gh = 1240, colunas = 180, linhas = 160, r = rng(11);
    const off = Math.floor(t * 30);
    const cw = gw / colunas, lh = gh / linhas, linha = Math.floor(colunas * 0.57);
    for (let j = 0; j < linhas; j++) for (let i = 0; i < colunas; i++) {
      const rr = hash(i, j + off); let v = rr ** 3 * 0.6;
      if (i === linha && (p.sinal ?? 1)) v = 0.85 + rr * 0.15;
      ctx.fillStyle = `rgb(${v * 120 | 0},${v * 255 | 0},${(0.2 + v * 0.8) * 255 | 0})`;
      ctx.fillRect(gx + i * cw, gy + j * lh, cw + 0.5, lh + 0.5);
    }
    if (p.sinal ?? 1) { brilho(gx + (linha + 0.5) * cw, gy + gh / 2, 260, 'rgba(120,255,255,0.35)'); rotulo('982,002 MHz', gx + (linha + 0.5) * cw, gy + gh + 60, 44, '#7ff6ff'); }
    rotulo('FREQUÊNCIA →', CX, gy - 50, 30, '#9fb8e0'); rotulo('TEMPO ↓', gx + 10, gy + gh + 60, 26, '#9fb8e0', 'left');
  },
  // vácuo falso: bola na beira de um degrau da curva de energia; p.cai faz a bola rolar
  degrau(t, d, p) {
    ceu(t, 0.35);
    const x0 = 120, x1 = W - 120, yTop = 760, yFundo = 1380;
    const curva = x => { const u = (x - x0) / (x1 - x0);
      return u < 0.42 ? yTop + 60 * Math.sin(Math.PI * u / 0.42) ** 2 : yTop + (yFundo - yTop) * ease((u - 0.42) / 0.4); };
    ctx.strokeStyle = '#7fb6ff'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath();
    for (let x = x0; x <= x1; x += 4) { const y = curva(x); if (x === x0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke();
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#7fb6ff'; ctx.lineTo(x1, H); ctx.lineTo(x0, H); ctx.fill(); ctx.globalAlpha = 1;
    rotulo('VÁCUO FALSO', x0 + 170, yTop + 180, 40, '#ffd24a'); rotulo('VÁCUO VERDADEIRO', x1 - 230, yFundo + 90, 40, '#ff7a5a');
    const cai = p.cai ? ease((t - 0.6) / (d * 0.6)) : 0, xu = lerp(0.405, 0.86, cai) * (x1 - x0) + x0;
    const tremor = p.cai ? 0 : Math.sin(t * 9) * 3;
    const yb = curva(xu) - 46; brilho(xu, yb, 120, 'rgba(255,220,120,0.5)');
    const g = ctx.createRadialGradient(xu - 15, yb - 15, 5, xu, yb, 46); g.addColorStop(0, '#fff3c0'); g.addColorStop(1, '#e09a2a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(xu + tremor, yb, 46, 0, 6.283); ctx.fill();
    rotulo('NOSSO UNIVERSO?', xu, yb - 100, 34, '#fff');
  },
  // bolha de vácuo verdadeiro crescendo e apagando as estrelas
  bolha(t, d, p) {
    ceu(t, 1);
    // galáxias
    const r = rng(19); for (let i = 0; i < 14; i++) { const x = r() * W, y = r() * H; brilho(x, y, 30 + r() * 50, `rgba(${180 + r() * 70},${170 + r() * 60},255,0.7)`); }
    const R = Math.pow(clamp(t / d, 0, 1), 1.6) * 1500, cx = W * 0.62, cy = H * 0.4;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(200,230,255,0.95)'; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();
    brilho(cx, cy, R + 120, 'rgba(120,180,255,0)', 1);
    const g = ctx.createRadialGradient(cx, cy, Math.max(0, R - 40), cx, cy, R + 120); g.addColorStop(0, 'rgba(160,210,255,0.9)'); g.addColorStop(1, 'rgba(160,210,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R + 120, 0, 6.283); ctx.fill();
  },
  // Planeta Nove: órbitas alongadas e alinhadas dos objetos transnetunianos, e a órbita suposta do planeta
  orbitas(t, d, p) {
    ceu(t, 0.6);
    const k = ease(t / (d * 0.6));
    estrela(CX, CY, 10, '#fffbe0', '#ffc94a', t); rotulo('SOL', CX, CY + 40, 26, '#ffe28a');
    ctx.strokeStyle = 'rgba(120,180,255,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, 60, 0, 6.283); ctx.stroke();
    rotulo('NETUNO', CX + 62, CY - 70, 22, '#9fc6ff', 'left');
    const cores = ['#ffd24a', '#ffb64a', '#ffe08a', '#f5a03a', '#ffcf6a', '#ffd9a0'];
    for (let i = 0; i < 6; i++) {
      const a = 260 + i * 40, e = 0.75, ang = -0.5 + (i - 2.5) * 0.12;
      ctx.save(); ctx.translate(CX, CY); ctx.rotate(ang); ctx.strokeStyle = cores[i]; ctx.globalAlpha = 0.85 * k; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(-a * e, 0, a, a * Math.sqrt(1 - e * e), 0, 0, 6.283); ctx.stroke(); ctx.restore();
    }
    if (p.nove) { const kk = ease((t - d * 0.4) / (d * 0.5)), a = 520, e = 0.4, ang = -0.5 + Math.PI;
      ctx.save(); ctx.translate(CX, CY); ctx.rotate(ang); ctx.setLineDash([18, 14]); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.globalAlpha = kk; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(-a * e, 0, a, a * Math.sqrt(1 - e * e), 0, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
      const pa = t * 0.15 + 2.6, px = -a * e + Math.cos(pa) * a, py = Math.sin(pa) * a * Math.sqrt(1 - e * e);
      brilho(px, py, 70, 'rgba(140,170,255,0.6)', kk); ctx.fillStyle = '#1a2440'; ctx.beginPath(); ctx.arc(px, py, 26, 0, 6.283); ctx.fill(); ctx.restore();
      rotulo('PLANETA NOVE?', CX - 300, CY + 560, 46, '#ffffff', 'center', kk); }
  },
  // rajadas rápidas de rádio: pulsos no tempo, ativos só em janelas que se repetem a cada ~16 dias
  ritmo(t, d, p) {
    ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, W, H); ceu(t, 0.25);
    const gx = 70, gw = W - 140, gy = 900, dias = 64, k = clamp(t / (d * 0.9), 0, 1);
    for (let c = 0; c < 4; c++) { const x = gx + (c * 16.35 + 2) / dias * gw; ctx.fillStyle = 'rgba(255,200,80,0.14)'; ctx.fillRect(x, gy - 420, 4 / dias * gw, 520); }
    ctx.strokeStyle = 'rgba(160,190,255,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx, gy + 100); ctx.lineTo(gx + gw, gy + 100); ctx.stroke();
    const r = rng(5);
    for (let i = 0; i < 70; i++) { const c = Math.floor(r() * 4), dia = c * 16.35 + 2 + r() * 4; if (dia / dias > k) continue;
      const x = gx + dia / dias * gw, h = 120 + r() * 280; ctx.strokeStyle = '#7ff6ff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, gy + 100); ctx.lineTo(x, gy + 100 - h); ctx.stroke(); brilho(x, gy + 100 - h, 30, 'rgba(127,246,255,0.8)'); }
    for (let c = 0; c < 4; c++) rotulo(`DIA ${Math.round(c * 16.35)}`, gx + (c * 16.35 + 4) / dias * gw, gy + 160, 26, '#ffd24a');
    rotulo('CICLO DE ~16 DIAS', CX, gy - 520, 50, '#ffffff');
    // pulso viajando no topo
    const px = ((t * 900) % (W + 400)) - 200; brilho(px, 330, 120, 'rgba(127,246,255,0.7)');
  },
  // espuma cósmica: galáxias em filamentos e uma bolha vazia enorme no meio, com a Via Láctea minúscula para escala
  vazio(t, d, p) {
    ctx.fillStyle = '#010205'; ctx.fillRect(0, 0, W, H);
    const r = rng(23), z = lerp(p.z0 ?? 1, p.z1 ?? 1.3, ease(t / d)), vr = 380;
    ctx.save(); ctx.translate(CX, CY); ctx.scale(z, z); ctx.translate(-CX, -CY);
    const nos = []; for (let i = 0; i < 70; i++) { let x, y; do { x = r() * W * 1.4 - W * 0.2; y = r() * H * 1.2 - H * 0.1; } while (Math.hypot(x - CX, y - CY) < vr + 60); nos.push([x, y]); }
    for (let i = 0; i < 26000; i++) { const a = nos[Math.floor(r() * nos.length)], b = nos[Math.floor(r() * nos.length)];
      if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 360) continue; const u = r(), x = lerp(a[0], b[0], u) + (r() - 0.5) * 18, y = lerp(a[1], b[1], u) + (r() - 0.5) * 18;
      if (Math.hypot(x - CX, y - CY) < vr) continue; ctx.fillStyle = `rgba(${170 + r() * 85},${170 + r() * 80},255,${0.5 + r() * 0.5})`; ctx.fillRect(x, y, 3.4, 3.4); }
    for (const [x, y] of nos) brilho(x, y, 26, 'rgba(200,210,255,0.6)');
    // poucas galáxias dentro do vazio
    const r2 = rng(4); for (let i = 0; i < 12; i++) { const a = r2() * 6.283, dd = r2() * vr * 0.85; brilho(CX + Math.cos(a) * dd, CY + Math.sin(a) * dd, 9, 'rgba(255,240,200,0.9)'); }
    ctx.strokeStyle = 'rgba(255,210,100,0.55)'; ctx.setLineDash([16, 12]); ctx.lineWidth = 4 / z; ctx.beginPath(); ctx.arc(CX, CY, vr, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    if (p.escala) { const vl = vr * z / 3300 * 2; rotulo('VIA LÁCTEA (EM ESCALA)', CX, CY + vr * z + 70, 30, '#ffd24a'); ctx.fillStyle = '#fff'; ctx.fillRect(CX - 1, CY + vr * z + 20, Math.max(2, vl), 2); }
  },
  // enxame de Dyson: painéis orbitando uma anã vermelha, brilhando em infravermelho; p.some dissolve no fim
  dyson(t, d, p) {
    ceu(t, 0.7);
    const k = p.some ? 1 - ease((t - d * 0.4) / (d * 0.5)) : ease(t / (d * 0.5));
    estrela(CX, CY, 120, '#ffd0a0', '#d0401a', t);
    const r = rng(31), n = 420;
    for (let i = 0; i < n; i++) {
      const anel = i % 6, inc = (anel - 2.5) * 0.42, raio = 240 + anel * 22, fase = (i / n) * 6.283 * 6 + t * (0.35 + anel * 0.05);
      const x = Math.cos(fase) * raio, z = Math.sin(fase) * raio, y = z * Math.sin(inc) * 0.9;
      const atras = z < 0 && Math.hypot(x, y) < 120; if (atras || r() > k) continue;
      const s = 11, lum = z > 0 ? 1 : 0.5; r();
      ctx.save(); ctx.translate(CX + x, CY + y); ctx.rotate(fase); ctx.fillStyle = `rgba(${255 * lum | 0},${120 * lum | 0},${60 * lum | 0},0.95)`;
      ctx.fillRect(-s, -s * 0.4, s * 2, s * 0.8); ctx.restore();
    }
    brilho(CX, CY, 520, `rgba(255,60,30,${0.25 * k})`);
  },
};
window.desenhar = (cena, t, d, p) => { ctx.setTransform(1, 0, 0, 1, 0, 0); CENAS[cena](t, d, p || {}); };
</script>
</body></html>
