<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"MX";src:url("../fonts/Montserrat-ExtraBold.ttf")}
  @font-face{font-family:"MM";src:url("Montserrat-Medium.ttf")}
  html,body{margin:0;background:#070b1a;overflow:hidden}canvas{display:block}
</style>
<script src="geo/topojson-client.min.js"></script>
<script src="geo/land.js"></script>
<script src="geo/paises.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Motion graphics do longo "A Via Láctea está em rota de colisão" (Andrômeda, 1920x1080). Helpers iguais aos de mundo.html.
// Cada cena é única. Mapas com dados reais (Natural Earth via world-atlas).
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { bg1: '#070b1a', bg2: '#121a3a', mar: '#0e2a47', mar2: '#0a1f36', terra: '#2c4a5e', terra2: '#3d6178', borda: '#6f90a8',
  laranja: '#f4a261', verm: '#e76f51', ouro: '#ffd166', branco: '#f4f1e8', cinza: '#8a93b8', escuro: '#1b2240', azul: '#4cc9f0',
  magma: '#ff6b2c', rocha: '#5a4636', rocha2: '#3e3027', verde: '#7cc98a', roxo: '#9b7bff' };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const easeOut = x => { x = clamp(x, 0, 1); return 1 - (1 - x) ** 3; };
const back = x => { x = clamp(x, 0, 1); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const RAD = Math.PI / 180;
function rng(seed) { let a = Math.imul(seed + 1, 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const EST = (() => { const r = rng(23), a = []; for (let i = 0; i < 420; i++) a.push([r() * W, r() * H, r() * 1.6 + 0.3, r()]); return a; })();
const fmt = n => Math.round(n).toLocaleString('pt-BR');

function fundo(t, estrelas = 1, c1 = P.bg2, c2 = P.bg1) {
  const g = ctx.createRadialGradient(CX, CY * 0.8, 100, CX, CY, W * 0.75); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (estrelas > 0) for (const [x, y, r, f] of EST) { ctx.globalAlpha = estrelas * (0.25 + 0.35 * Math.abs(Math.sin(t * 0.9 + f * 30)));
    ctx.fillStyle = P.branco; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function vinheta(a = 0.55) {
  const g = ctx.createRadialGradient(CX, CY, H * 0.45, CX, CY, W * 0.68); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function txt(s, x, y, size, cor = P.branco, a = 1, alinh = 'center', fonte = 'MX') {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px ${fonte}`; ctx.textAlign = alinh; ctx.textBaseline = 'middle';
  ctx.fillStyle = cor; ctx.fillText(s, x, y); ctx.restore();
}
function sobe(s, x, y, size, t, t0 = 0, cor = P.branco, alinh = 'center', fonte = 'MX') {
  const e = back((t - t0) / 0.5); if (e <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(e, 0, 1); ctx.translate(0, (1 - e) * 40); txt(s, x, y, size, cor, 1, alinh, fonte); ctx.restore();
}
function pilula(s, x, y, size, fundoCor, cor, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = `${size}px MX`; const w = ctx.measureText(s).width + size * 1.2, h = size * 1.7;
  ctx.fillStyle = fundoCor; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = cor; ctx.fillText(s, x, y + 2); ctx.restore();
}
function brilho(x, y, r, cor, a = 1) {
  ctx.save(); ctx.globalAlpha = a; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, cor); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function circ(x, y, r, cor) { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 6.283); ctx.fill(); }
function anel(x, y, r, cor, lw, a0 = 0, a1 = 6.283) { ctx.strokeStyle = cor; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), a0, a1); ctx.stroke(); }
function flash(t, t0, d = 0.5) { const k = (t - t0) / d; if (k < 0 || k > 1) return; ctx.fillStyle = `rgba(255,250,235,${(1 - k) ** 2})`; ctx.fillRect(0, 0, W, H); }
function pino(x, y, t, rotulo, sub, cor = P.verm) {
  const e = back(t / 0.5); if (e <= 0) return;
  for (let k = 0; k < 2; k++) { const f = ((t * 0.7 + k * 0.5) % 1); anel(x, y, 10 + f * 60, `rgba(231,111,81,${(1 - f) * 0.8})`, 3); }
  ctx.save(); ctx.translate(x, y); ctx.scale(e, e); circ(0, 0, 13, cor); circ(0, 0, 5, P.branco); ctx.restore();
  if (rotulo) { const a = ease((t - 0.3) / 0.4); ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = P.branco; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 16, y - 16); ctx.lineTo(x + 70, y - 70); ctx.lineTo(x + 110, y - 70); ctx.stroke(); ctx.restore();
    txt(rotulo, x + 120, y - 74, 46, P.branco, a, 'left'); if (sub) txt(sub, x + 122, y - 30, 30, P.ouro, a, 'left', 'MM'); }
}
// pedra irregular com crateras
function pedra(x, y, R, rot, seed = 3, cor1 = '#6b5d52', cor2 = '#463b33') {
  const r = rng(seed); const pts = []; for (let i = 0; i < 28; i++) pts.push(1 + (r() - 0.5) * 0.28);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-R * 0.35, -R * 0.35, R * 0.1, 0, 0, R * 1.1); g.addColorStop(0, cor1); g.addColorStop(1, cor2);
  ctx.fillStyle = g; ctx.beginPath(); pts.forEach((k, i) => { const a = i / 28 * 6.283; const px = Math.cos(a) * R * k, py = Math.sin(a) * R * k * 0.86; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 7; i++) { const a = r() * 6.283, d = r() * 0.6 * R, rr = R * (0.06 + r() * 0.1); circ(Math.cos(a) * d, Math.sin(a) * d * 0.86, rr, 'rgba(0,0,0,0.22)'); }
  ctx.restore();
}

// ---------------- geografia ----------------
const LAND = topojson.feature(TOPO_LAND, TOPO_LAND.objects.land);
const FRONT = topojson.mesh(TOPO_PAISES, TOPO_PAISES.objects.countries, (a, b) => a !== b);
const polys = []; for (const f of (LAND.features || [LAND])) { const g = f.geometry || f; if (g.type === 'Polygon') polys.push(g.coordinates); else for (const c of g.coordinates) polys.push(c); }
const merc = lat => Math.log(Math.tan(Math.PI / 4 + clamp(lat, -85, 85) * RAD / 2)) / RAD;
// mapa Mercator: centro (lon0, lat0), k = px por grau
function mapa(lon0, lat0, k, opc = {}) {
  const pr = (lon, lat) => [CX + (lon - lon0) * k, CY - (merc(lat) - merc(lat0)) * k];
  ctx.fillStyle = opc.mar || P.mar2; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = 'rgba(120,150,190,0.12)'; ctx.lineWidth = 1;
  const passo = k > 40 ? 5 : k > 12 ? 10 : 20;
  for (let L = -180; L <= 180; L += passo) { const [x] = pr(L, 0); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let L = -80; L <= 80; L += passo) { const [, y] = pr(0, L); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  const p = new Path2D();
  for (const poly of polys) for (const ring of poly) { let prev = null; ring.forEach(([lon, lat], i) => {
    const [x, y] = pr(lon, lat); (i && Math.abs(lon - prev) < 180) ? p.lineTo(x, y) : p.moveTo(x, y); prev = lon; }); p.closePath(); }
  ctx.fillStyle = opc.terra || P.terra; ctx.fill(p);
  ctx.strokeStyle = opc.costa || P.borda; ctx.lineWidth = 1.4; ctx.stroke(p);
  if (opc.fronteiras !== false) { ctx.save(); ctx.strokeStyle = 'rgba(200,220,240,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const line of FRONT.coordinates) line.forEach(([lon, lat], i) => { const [x, y] = pr(lon, lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.restore(); }
  return pr;
}
// zoom suave de mapa: de (lon,lat,k) para (lon,lat,k)
function mapaZoom(t, a, b, d = 2.6, opc) { const e = ease(t / d); const k = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), e));
  return mapa(lerp(a[0], b[0], e), lerp(a[1], b[1], e), k, opc); }
// globo ortográfico
function globo(cx, cy, R, lon0, lat0, opc = {}) {
  const f0 = lat0 * RAD;
  const pr = (lon, lat) => { const l = (lon - lon0) * RAD, f = lat * RAD;
    const cosc = Math.sin(f0) * Math.sin(f) + Math.cos(f0) * Math.cos(f) * Math.cos(l);
    let x = Math.cos(f) * Math.sin(l), y = Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(l);
    if (cosc < 0) { const n = Math.hypot(x, y) || 1; x /= n; y /= n; }
    return [cx + x * R, cy - y * R, cosc >= 0]; };
  const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  g.addColorStop(0, opc.mar1 || '#1d5a85'); g.addColorStop(1, opc.mar2 || '#0b2440');
  circ(cx, cy, R, g);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.clip();
  const p = new Path2D();
  for (const poly of polys) for (const ring of poly) { let alguma = false; const pts = ring.map(([lo, la]) => { const q = pr(lo, la); if (q[2]) alguma = true; return q; });
    if (!alguma) continue; pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); }
  ctx.fillStyle = opc.terra || '#3f7a5a'; ctx.fill(p);
  const s = ctx.createRadialGradient(cx - R * 0.4, cy - R * 0.4, R * 0.2, cx, cy, R * 1.05);
  s.addColorStop(0, 'rgba(255,255,255,0.08)'); s.addColorStop(0.7, 'rgba(0,0,0,0)'); s.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = s; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R); ctx.restore();
  anel(cx, cy, R + 4, opc.atm || 'rgba(120,200,255,0.35)', 8);
  return pr;
}
// silhueta de cidade
function cidade(base, seed, cor, alt = 1, x0 = 0, x1 = W) {
  const r = rng(seed); ctx.fillStyle = cor; let x = x0;
  while (x < x1) { const w = 30 + r() * 70, h = (40 + r() * 160 + (r() < 0.12 ? 160 : 0)) * alt; ctx.fillRect(x, base - h, w - 4, h); x += w; }
  ctx.fillRect(x0, base, x1 - x0, H - base);
}
// camadas de rocha em corte
function estratos(y0, t) {
  const cores = ['#6b5340', '#5c4636', '#4c3a2e', '#3f3027', '#332720'];
  for (let i = 0; i < 5; i++) { ctx.fillStyle = cores[i]; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, y0 + i * 95 + Math.sin(x * 0.004 + i) * 14); ctx.lineTo(W, H); ctx.fill(); }
}
function grama(y, cor = '#2e4a2c') { ctx.fillStyle = cor; ctx.fillRect(0, y - 10, W, 14); }

// ---------------- cenas ----------------
function globoMini(x, y, R, t) { const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.3, 2, x, y, R); g.addColorStop(0, '#5fb0e0'); g.addColorStop(1, '#123a66'); circ(x, y, R, g);
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, 6.283); ctx.clip(); ctx.fillStyle = '#4f9a6a'; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x + Math.sin(t * 0.5 + i * 1.7) * R * 0.6, y + (i - 1.5) * R * 0.45, R * 0.35, R * 0.18, i, 0, 6.283); ctx.fill(); } ctx.restore(); }
function galaxia(x, y, R, t, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(t * 0.1); ctx.scale(1, 0.55);
  for (let i = 0; i < 380; i++) { const r = rng(i + 77), br = i % 2, rr = Math.sqrt(r()) * R, an = rr / R * 5 + br * Math.PI + (r() - 0.5) * 0.7; circ(Math.cos(an) * rr, Math.sin(an) * rr, 1.4 + r() * 1.6, `rgba(${200 + r() * 55},${200 + r() * 40},255,${0.5 + r() * 0.4})`); }
  brilho(0, 0, R * 0.4, 'rgba(255,240,210,0.9)'); ctx.restore(); }
const CENAS = {};
const LAR = '#ff8a3d';
function fundoU(c1 = '#1a1430', c2 = '#05040c') { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function pessoa(x, y, s, cor) { circ(x, y - 46 * s, 20 * s, cor); ctx.fillStyle = cor; ctx.beginPath(); ctx.roundRect(x - 22 * s, y - 22 * s, 44 * s, 70 * s, 18 * s); ctx.fill(); }
function titulo2(a, b, t, cor = P.branco, cor2 = LAR) { sobe(a, CX, 150, 64, t, 0.1, cor); if (b) txt(b, CX, 215, 32, cor2, ease((t - 0.3) / 0.4), 'center', 'MM'); }
const VERM2 = '#ff3b3b', ROSA = '#ff7ab0';
function m31(x, y, R, ang = -0.6, a = 1) {   // Andrômeda estilizada: disco inclinado, núcleo e faixas de poeira
  if (a <= 0 || R <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(ang); ctx.scale(1, 0.32);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, 'rgba(255,244,220,0.95)'); g.addColorStop(0.18, 'rgba(240,220,190,0.6)'); g.addColorStop(0.6, 'rgba(160,170,210,0.25)'); g.addColorStop(1, 'rgba(120,140,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(40,30,30,0.35)'; ctx.lineWidth = Math.max(1, R * 0.025);
  for (const k of [0.45, 0.62, 0.78]) { ctx.beginPath(); ctx.ellipse(0, R * 0.04, R * k, R * k * 0.82, 0, 3.4, 6.0); ctx.stroke(); } ctx.restore(); if (R > 6) brilho(x, y, R * 0.12, `rgba(255,248,230,${0.9 * a})`);
}
function vialactea(x, y, R, t, a = 1, giro = 0) { galaxia(x, y, R, t * 0.3 + giro, a); }
function horizonte(cor = '#05060a', y0 = 900) { ctx.fillStyle = cor; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, y0 - 50 * Math.sin(x * 0.004 + 1) - 25 * Math.sin(x * 0.017)); ctx.lineTo(W, H); ctx.fill(); }
function ceuNoite(t, faixa = 1) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03050d'); g.addColorStop(0.8, '#0d1430'); g.addColorStop(1, '#1b2040'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, a] of EST) circ(x, y * 0.85, r, `rgba(255,255,255,${0.25 + 0.5 * a})`);
  if (faixa) { ctx.save(); ctx.translate(1250, 420); ctx.rotate(1.1); const gb = ctx.createLinearGradient(0, -230, 0, 230); gb.addColorStop(0, 'rgba(170,160,220,0)'); gb.addColorStop(0.5, `rgba(200,190,235,${0.2 * faixa})`); gb.addColorStop(1, 'rgba(170,160,220,0)'); ctx.fillStyle = gb; ctx.fillRect(-1400, -230, 2800, 460);
    for (let i = 0; i < 1300; i++) { const r = rng(i + 500); circ((r() - 0.5) * 2800, (r() + r() + r() - 1.5) * 140, 0.6 + r() * 1.5, `rgba(255,250,240,${(0.15 + r() * 0.45) * faixa})`); } ctx.restore(); } }
function cartao(x, y, w, h, a, borda = 'rgba(76,201,240,0.7)') { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(8,14,30,0.92)'; ctx.strokeStyle = borda; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 24); ctx.fill(); ctx.stroke(); ctx.restore(); }
function carimbo(x, y, s, t, t0, texto, cor = VERM2, rot = -0.12) { const k = (t - t0) / 0.25; if (k < 0) return; const e = k >= 1 ? 1 : 1 + 1.4 * (1 - k);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(e, e); ctx.globalAlpha = Math.min(1, k * 2); ctx.font = `${s}px MX`; const w = ctx.measureText(texto).width + s; ctx.strokeStyle = cor; ctx.lineWidth = 8; ctx.beginPath(); ctx.roundRect(-w / 2, -s * 0.8, w, s * 1.6, 14); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = cor; ctx.fillText(texto, 0, 4); ctx.restore(); }
function etiq(s, a = 1) { pilula(s, CX, 840, 26, 'rgba(0,0,0,0.6)', P.cinza, a); }

// ---------- cartão de capítulo ----------
CENAS.a_cap = (t, d, p) => {
  fundoU(p.c1 || '#141030', '#030208'); const r = rng(p.seed || 3); for (let i = 0; i < 120; i++) { const x = r() * W, y = ((r() * H - t * (15 + r() * 30)) % H + H) % H; circ(x, y, r() * 2.2 + 0.4, `rgba(200,210,255,${0.15 + r() * 0.3})`); }
  if (p.num) txt('CAPÍTULO ' + p.num, CX, CY - 190, 40, p.cor || P.azul, ease((t - 0.05) / 0.3), 'center', 'MM');
  const k = easeOut((t - 0.2) / 0.6); ctx.fillStyle = p.cor || P.azul; ctx.fillRect(CX - 460 * k, CY + 50, 920 * k, 6);
  ctx.font = '118px MX'; const tam = Math.min(118, 118 * 1700 / ctx.measureText(p.titulo).width); sobe(p.titulo, CX, CY - 60, tam, t, 0.1, P.branco); if (p.cont) pilula(p.cont, CX, CY + 150, 54, 'rgba(0,0,0,0.55)', p.cor || P.ouro, ease((t - 0.45) / 0.3)); vinheta(0.6); };

// ---------- GANCHO ----------
CENAS.a_rota = (t, d) => {   // duas galáxias numa reta de colisão
  fundo(t, 1, '#0a0d24', '#020309'); const k = ease((t - 0.1) / (d - 0.2)); vialactea(470, 600, 300, t, 1); txt('VIA LÁCTEA', 470, 860, 40, P.azul);
  m31(lerp(1520, 1440, k), 420, 330, -0.5); txt('ANDRÔMEDA', 1480, 200, 40, P.ouro); ctx.setLineDash([20, 16]); ctx.strokeStyle = 'rgba(255,59,59,0.85)'; ctx.lineWidth = 6;
  const e = ease((t - 0.2) / 0.9); ctx.beginPath(); ctx.moveTo(1380, 450); ctx.lineTo(lerp(1380, 640, e), lerp(450, 570, e)); ctx.stroke(); ctx.setLineDash([]); pilula('ROTA DE COLISÃO', CX, 150, 52, 'rgba(230,57,70,0.95)', '#fff', ease((t - 0.7) / 0.3)); };
CENAS.a_numeros = (t, d) => {   // 1 trilhão de estrelas · 400.000 km/h
  fundo(t, 1.2, '#0d0f26', '#020309'); for (let i = 0; i < 1100; i++) { const r = rng(i + 900), a = r() * 6.283, rr = Math.sqrt(r()) * 380 * ease((t - (i % 40) * 0.01) / 0.8); circ(560 + Math.cos(a) * rr, 470 + Math.sin(a) * rr * 0.42, 1.2 + r() * 1.4, `rgba(255,${220 + r() * 35},${190 + r() * 60},${0.4 + r() * 0.5})`); }
  brilho(560, 470, 130, 'rgba(255,240,210,0.8)'); txt(fmt(1e12 * easeOut((t - 0.1) / 1.0)), 1380, 360, 84, P.branco); txt('ESTRELAS', 1380, 440, 44, P.ouro, ease((t - 0.3) / 0.3));
  txt(fmt(400000 * easeOut((t - 0.6) / 0.9)) + ' KM/H', 1380, 600, 84, VERM2, ease((t - 0.6) / 0.3)); txt('DIRETO PRA CÁ', 1380, 680, 38, P.cinza, ease((t - 0.9) / 0.3), 'center', 'MM'); };
CENAS.a_passos = (t, d) => {   // a simulação passo a passo: 3 quadros

  it.forEach(([s, i]) => { const a = back((t - 0.2 - i * 0.35) / 0.5); if (a <= 0) return; const x = 420 + i * 540; ctx.save(); ctx.translate(x, 440); ctx.scale(a, a); cartao(0, 0, 440, 360, 1);

  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#05040a'); g.addColorStop(0.75, '#2a1810'); g.addColorStop(1, '#3a2012'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); for (const [x, y, r, a] of EST) circ(x, y * 0.7, r, `rgba(255,255,255,${0.2 + 0.5 * a})`);

CENAS.a_thumb = (t, d) => {   // thumb: as duas galáxias prestes a bater
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03040c'); g.addColorStop(1, '#10142c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); for (const [x, y, r, a] of EST) circ(x, y, r * 1.2, `rgba(255,255,255,${0.3 + 0.6 * a})`);

  brilho(1420, 470, 260, 'rgba(255,90,60,0.45)'); for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283; ctx.strokeStyle = 'rgba(255,200,120,0.8)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(1420 + Math.cos(a) * 90, 470 + Math.sin(a) * 90); ctx.lineTo(1420 + Math.cos(a) * 170, 470 + Math.sin(a) * 170); ctx.stroke(); }
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 30;
  const pinta = (s2, x, y, tam, cor, lw) => { ctx.font = `${tam}px MX`; ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.strokeText(s2, x, y); ctx.fillStyle = cor; ctx.fillText(s2, x, y); };
  pinta('NOSSA GALÁXIA', 60, 170, 150, '#ffffff', 22); pinta('VAI BATER', 60, 350, 190, '#ff2a2a', 24); pinta('EM OUTRA', 60, 540, 190, '#ff2a2a', 24); ctx.restore();
  pilula('VIA LÁCTEA', 1300, 960, 40, 'rgba(0,0,0,0.6)', P.azul, 1); pilula('ANDRÔMEDA', 1640, 120, 40, 'rgba(0,0,0,0.6)', P.ouro, 1); };

// p.sat (dessaturar) é aplicado depois, no ffmpeg (motor_h): ctx.filter deixa o canvas lento demais
window.desenhar = (cena, t, dur, p) => { p = p || {}; ctx.save(); ctx.clearRect(0, 0, W, H); CENAS[cena](t, dur, p); ctx.restore(); };
window.CENAS = CENAS;
