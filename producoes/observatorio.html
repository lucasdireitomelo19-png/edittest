<title>Observatório Lado Sombrio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cena 3D fixa (planeta, lua, cinturão, estrelas) atrás; navegação de 5 estações no topo; cada estação move a câmera e mostra seus painéis de vidro. */
:root {
  color-scheme: dark;
  --void: #04050c;
  --ink: #eaedff;
  --ink-dim: #a6acd2;
  --ink-faint: #6b7199;
  --glass: rgba(140, 155, 255, 0.07);
  --glass-hi: rgba(170, 185, 255, 0.14);
  --glass-solid: rgba(10, 12, 28, 0.72);
  --edge: rgba(190, 200, 255, 0.16);
  --edge-hi: rgba(210, 220, 255, 0.34);
  --accent: #9d8cff;
  --accent-2: #5fd4ff;
  --ember: #ff8a4c;
  --ok: #5fe3a1;
  --warn: #ffc65c;
  --bad: #ff6b7d;
  --work: #5fd4ff;
  --f-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 18px;
}
* { box-sizing: border-box; }
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100vh; }
#space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.shade { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 120%, rgba(4,5,12,0) 30%, rgba(4,5,12,.55) 100%); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(6, 8, 20, 0.9); }

/* ---------- topo ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  background: linear-gradient(180deg, rgba(4,5,12,.85), rgba(4,5,12,.35));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--edge);
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.logo b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.logo b span { background: linear-gradient(90deg, var(--ink), var(--accent) 60%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo small { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav a { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; padding: 8px 12px; border-radius: 999px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 7px; }
nav a .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .55; }
nav a[aria-current="page"] { color: var(--ink); border-color: var(--edge-hi); background: var(--glass-hi); }
nav a[aria-current="page"] .dot { opacity: 1; background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
nav a:hover { color: var(--ink); }
nav a .badge { font-size: 10px; background: var(--warn); color: var(--void); border-radius: 999px; padding: 0 6px; font-weight: 700; }
nav a .badge:empty { display: none; }
.clock { font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- estações ---------- */
main {
  position: relative; z-index: 1; max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 26px 70px;
}
.station { display: grid; gap: 20px; animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.st-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.st-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 4.2vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
.st-head p { margin: 6px 0 0; color: var(--ink-dim); max-width: 60ch; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-2); }
.glass {
  background: linear-gradient(160deg, var(--glass-hi), var(--glass) 55%), var(--glass-solid);
  border: 1px solid var(--edge); border-radius: var(--r);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
}
.panel { padding: 18px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 0 0 12px; letter-spacing: .01em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel h2 small { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--ink-faint); letter-spacing: .04em; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; display: grid; gap: 2px; min-width: 0; position: relative; overflow: hidden; }
.kpi .n { font-family: var(--f-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--ink-dim); font-size: 13px; }
.kpi .s { color: var(--ink-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi svg { position: absolute; right: 0; bottom: 0; width: 55%; height: 46px; opacity: .55; }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-work { color: var(--work); } .c-acc { color: var(--accent); } .c-ember { color: var(--ember); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.row .t { font-weight: 600; font-size: 14px; }
.row .d { color: var(--ink-dim); font-size: 13px; }
.empty { color: var(--ink-faint); font-size: 13.5px; padding: 14px; text-align: center; }
.datebox { font-family: var(--f-mono); text-align: center; border: 1px solid var(--edge); border-radius: 10px; padding: 4px 0; width: 54px; line-height: 1.15; }
.datebox b { display: block; font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.datebox small { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .1em; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-work { color: var(--work); } .s-wait { color: var(--warn); } .s-idle { color: var(--ok); } .s-fail { color: var(--bad); } .s-none { color: var(--ink-faint); }
.s-work.pill::before { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--glass-hi); border: 1px solid var(--edge-hi); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
.btn:hover { background: rgba(170,185,255,.24); }
.btn.primary { background: linear-gradient(135deg, rgba(157,140,255,.5), rgba(95,212,255,.38)); border-color: var(--accent); font-weight: 600; }
.btn.sm { font-size: 12px; padding: 4px 9px; border-radius: 8px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn:focus-visible, nav a:focus-visible, .vcard:focus-visible, .chip:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
textarea, input, select { font: inherit; font-size: 14px; color: var(--ink); background: rgba(4,5,12,.55); border: 1px solid var(--edge-hi); border-radius: 10px; padding: 8px 10px; width: 100%; color-scheme: dark; }
textarea { min-height: 84px; resize: vertical; }
label.f { display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-dim); }
.msg { font-size: 12.5px; color: var(--ink-faint); min-height: 1.2em; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); } .msg.warn { color: var(--warn); }

/* agentes */
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.agent { padding: 16px; display: grid; gap: 10px; align-content: start; position: relative; overflow: hidden; min-width: 0; }
.agent::before { content: ""; position: absolute; inset: -45% -45% auto auto; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, var(--halo, transparent), transparent 70%); opacity: .55; pointer-events: none; }
.agent .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.agent .name { font-weight: 700; font-size: 16px; }
.agent .role { color: var(--ink-faint); font-size: 12.5px; margin-top: -6px; }
.agent .doing { color: var(--ink-dim); font-size: 13.5px; min-height: 2.9em; }
.agent .meta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); align-items: center; }
.agent a { color: var(--accent-2); text-decoration: none; }
.agent form { display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.feed .dt { width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-top: 6px; }
.feed .who { font-weight: 600; }
.feed .ago { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); }
.feed .txt { color: var(--ink-dim); }

/* produção */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { padding: 12px; display: grid; gap: 10px; min-width: 0; }
.col h3 { margin: 0; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; color: var(--ink-dim); }
.col h3 b { color: var(--ink); }
.pcard { background: rgba(4,5,12,.55); border: 1px solid var(--edge); border-radius: 12px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.pcard .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; cursor: pointer; }
.pcard .t:hover { color: var(--accent-2); }
.pcard .m { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); display: flex; justify-content: space-between; gap: 6px; }
.pcard .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pcard input[type=date] { width: auto; padding: 3px 6px; font-size: 12px; border-radius: 8px; }
.newform { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 12px; }
.newform .full { grid-column: 1 / -1; }

/* vídeos */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; color: var(--ink-dim); background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: rgba(157,140,255,.2); }
.videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.vcard { all: unset; cursor: pointer; display: grid; grid-template-rows: auto 1fr; overflow: hidden; min-width: 0; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.vcard:hover { transform: translateY(-4px); }
.vcard .frame { position: relative; aspect-ratio: 9/16; max-width: 100%; background: #0b0d1c; overflow: hidden; border-bottom: 1px solid var(--edge); }
.vcard.longo { grid-column: span 2; } .vcard.longo .frame { aspect-ratio: 16/9; }
.vcard .frame video, .vcard .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vcard .badge { position: absolute; top: 8px; left: 8px; }
.vcard .num { position: absolute; bottom: 8px; right: 8px; font-family: var(--f-mono); font-size: 11px; padding: 3px 7px; border-radius: 6px; background: rgba(5,6,13,.7); color: var(--ink-dim); }
.vcard .body { padding: 12px; display: grid; gap: 6px; align-content: start; }
.vcard .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
.vcard .d { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); display: flex; justify-content: space-between; gap: 6px; }
.vcard .d .when { color: var(--accent-2); }
.vcard.is-postado .frame { opacity: .55; }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: rgba(5,6,13,.72); border: 1px solid var(--edge); color: var(--ink); }
.st-programado { color: var(--warn); } .st-postado { color: var(--ok); } .st-teste { color: var(--accent); }
.ph { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; padding: 12px; text-align: center; background: radial-gradient(circle at 30% 20%, rgba(157,140,255,.35), transparent 60%), radial-gradient(circle at 80% 90%, rgba(95,212,255,.25), transparent 55%), #0b0d1c; }
.ph-play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--edge-hi); background: rgba(255,255,255,.08); font-size: 16px; padding-left: 3px; }
.ph-t { font-family: var(--f-display); font-size: 13px; line-height: 1.25; text-wrap: balance; }

/* insights */
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 640px; height: 220px; display: block; }
.chart text { fill: var(--ink-faint); font-family: var(--f-mono); font-size: 10px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--edge); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid rgba(190,200,255,.07); vertical-align: middle; }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.retbar { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.retbar i { display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.retbar.low i { background: linear-gradient(90deg, #7a4a5a, var(--bad)); }
.ins { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ins li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; color: var(--ink-dim); }
.ins li::before { content: "✦"; color: var(--accent-2); }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
.split i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.fresh { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); }

/* modal */
dialog { padding: 0; border: none; background: transparent; color: var(--ink); max-width: min(980px, calc(100vw - 24px)); width: 100%; max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(3,4,10,.75); backdrop-filter: blur(6px); }
.modal { position: relative; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); overflow: hidden; align-items: start; }
.modal .player { background: #000; display: flex; align-items: center; justify-content: center; position: relative; min-height: 200px; }
.modal video { display: block; max-height: 80vh; max-width: 100%; }
.modal.short .player video { width: min(360px, 42vw); }
.modal.longo { grid-template-columns: 1fr; } .modal.longo video { width: 100%; max-height: 56vh; }
.modal .info { padding: 18px 20px 24px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.modal h3 { font-family: var(--f-display); font-weight: 600; font-size: 18px; margin: 0; text-wrap: balance; }
.vload { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-mono); font-size: 12px; background: rgba(5,6,13,.75); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 10px; pointer-events: none; white-space: nowrap; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(5,6,13,.5); border: 1px solid var(--edge); }
.seg button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-dim); background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"].v-pronto { color: var(--void); background: var(--ink-dim); }
.seg button[aria-pressed="true"].v-programado { color: var(--void); background: var(--warn); }
.seg button[aria-pressed="true"].v-postado { color: var(--void); background: var(--ok); }
.copy { display: grid; gap: 4px; }
.copy .lbl { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.copy pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--f-body); font-size: 13px; color: var(--ink-dim); background: rgba(5,6,13,.5); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; max-height: 160px; overflow-y: auto; }
.close { position: absolute; top: 10px; right: 10px; z-index: 2; }
.notes { font-size: 12.5px; color: var(--ink-faint); }
.dl-row { display: flex; flex-wrap: wrap; gap: 8px; }

@media (max-width: 980px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modal { grid-template-columns: 1fr; }
  .modal.short .player video { width: auto; max-height: 58vh; }
  .modal.longo video { max-height: none; }
}
@media (max-width: 560px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .newform { grid-template-columns: minmax(0, 1fr); }
  nav { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .clock { display: none; }
  .logo small { display: none; }
  .logo { min-width: 0; }
  .logo b { white-space: normal; }
  .videos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vcard.longo { grid-column: 1 / -1; }
  .kpi .n { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<canvas id="space" aria-hidden="true"></canvas>
<div class="shade"></div>

<div class="bar">
  <div class="bar-in">
    <div class="logo"><b><span>Observatório</span> Lado Sombrio</b><small>Canal 1</small></div>
    <nav aria-label="Estações">
      <a href="#comando" data-st="comando"><span class="dot"></span>Comando <span class="badge" id="b-wait"></span></a>
      <a href="#agentes" data-st="agentes"><span class="dot"></span>Agentes</a>
      <a href="#producao" data-st="producao"><span class="dot"></span>Produção <span class="badge" id="b-sem"></span></a>
      <a href="#videos" data-st="videos"><span class="dot"></span>Vídeos</a>
      <a href="#insights" data-st="insights"><span class="dot"></span>Insights</a>
    </nav>
    <div class="clock" id="clock"></div>
  </div>
</div>

<main id="main"></main>

<dialog id="dlg" aria-label="Detalhes do vídeo"><div class="modal glass" id="modal"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  /* =================== CENA 3D =================== */
  const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CAM = {
    comando:  { p: [0, 3, 34],    t: [0, 0, 0] },
    agentes:  { p: [-30, 8, 18],  t: [6, 0, 0] },
    producao: { p: [14, -6, 20],  t: [-4, 0, 0] },
    videos:   { p: [26, 16, 30],  t: [0, 2, -6] },
    insights: { p: [0, 34, 46],   t: [0, -4, 0] }
  };
  let three = null;
  function initSpace() {
    if (!window.THREE) return null;
    const cv = document.getElementById("space");
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); } catch (e) { return null; }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setClearColor(0x04050c, 1);
    const scene = new THREE.Scene();

  function chartSvg(dia) {
    const W = 900, H = 220, L = 46, R = 10, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
    const mv = Math.max(...dia.map(d => d.v)) * 1.08, mg = Math.max(...dia.map(d => d.g - d.p), 1) * 1.15;
    const x = i => L + (i / (dia.length - 1)) * iw, y = v => T + ih - (v / mv) * ih, yg = v => T + ih - (v / mg) * ih * .55;
    const step = Math.pow(10, Math.floor(Math.log10(mv / 4))); const tick = Math.ceil(mv / 4 / step) * step;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Views e inscritos por dia">`;
    for (let v = 0; v <= mv; v += tick) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(190,200,255,.08)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${kfmt(v)}</text>`;
    const bw = Math.max(3, iw / dia.length * .5);
    dia.forEach((d, i) => { const gv = d.g - d.p; s += `<rect x="${x(i) - bw / 2}" y="${yg(gv)}" width="${bw}" height="${T + ih - yg(gv)}" fill="rgba(157,140,255,.45)" rx="1.5"><title>${dayLabel(d.d)}: +${gv} inscritos</title></rect>`; });
    const pts = dia.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ");
    s += `<polygon points="${L},${T + ih} ${pts} ${x(dia.length - 1)},${T + ih}" fill="rgba(95,212,255,.12)"/><polyline points="${pts}" fill="none" stroke="#5fd4ff" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    dia.forEach((d, i) => { s += `<circle cx="${x(i)}" cy="${y(d.v)}" r="${i === dia.length - 1 ? 4 : 2.2}" fill="#5fd4ff"><title>${dayLabel(d.d)}: ${fmt(d.v)} views</title></circle>`; if (i % Math.ceil(dia.length / 8) === 0 || i === dia.length - 1) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.d.slice(8, 10)}/${d.d.slice(5, 7)}</text>`; });
    const peak = dia.reduce((a, d, i) => d.v > dia[a].v ? i : a, 0);
    s += `<text x="${x(peak)}" y="${y(dia[peak].v) - 8}" text-anchor="middle" style="fill:#eaedff">pico ${kfmt(dia[peak].v)}</text></svg>`;
    return s;
  }

    modal.append(pl);
    const info = el("div", "info");
    info.append(el("div", "eyebrow", (v.tipo === "longo" ? "Longo" : "Short") + " · #" + v.ordem), el("h3", "", v.nome || ""), statusControls(v));
    const dl = el("div", "dl-row"), msg = el("div", "msg");
    const base = ("lado-" + v.ordem + " " + (v.nome || "video")).replace(/[\\/:*?"<>|#]+/g, "").replace(/\s+/g, " ").trim();
    if (v.video_url) dl.append(saveButton("Baixar vídeo", v.video_url, base, "mp4", msg, true));
    if (v.thumb_url) dl.append(saveButton("Baixar thumb", v.thumb_url, base + " thumb", null, msg, false));
    info.append(dl, msg);
    const L = v.legendas || {};
    [["Título do YouTube", L.yt_titulo], ["Descrição do YouTube", L.yt_desc], ["TikTok", L.tiktok], ["Reels", L.reels], ["Tags", L.tags], ["Comentário fixado", L.comentario]].forEach(([k, t]) => { if (t) info.append(copyBlock(k, t)); });
    if (v.notas) info.append(el("div", "notes", v.notas));
    modal.append(info); dlg.showModal(); dlg.scrollTop = 0;
  }
  dlg.addEventListener("close", () => { const vd = modal.querySelector("video"); if (vd) vd.pause(); render(); });
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  /* =================== ROTEAMENTO =================== */
  const STATIONS = { comando: renderComando, agentes: renderAgentes, producao: renderProducao, videos: renderVideos, insights: renderInsights };
  function render() {
    if (dlg.open) return;
    const active = document.activeElement && document.activeElement.id;
    const keep = {}; main.querySelectorAll("textarea, input").forEach(i => { if (i.id && i.value) keep[i.id] = i.value; });
    main.innerHTML = ""; main.append(STATIONS[S.st]());
    Object.entries(keep).forEach(([id, val]) => { const i = document.getElementById(id); if (i && !i.value && i.type !== "date") i.value = val; });
    if (active) { const a = document.getElementById(active); if (a) a.focus({ preventScroll: true }); }
    document.querySelectorAll("nav a").forEach(a => { if (a.dataset.st === S.st) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const w = sortedAgents().filter(a => agentState(a).st === "wait").length;
    document.getElementById("b-wait").textContent = w ? String(w) : "";
    document.getElementById("b-sem").textContent = semData().length ? String(semData().length) : "";
  }
  let renderQ = 0;
  const schedule = () => { if (renderQ) return; renderQ = requestAnimationFrame(() => { renderQ = 0; const typing = document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName) && main.contains(document.activeElement); if (typing) { setTimeout(schedule, 1500); return; } render(); }); };
  function route() {
    const h = (location.hash || "").replace("#", ""); S.st = STATIONS[h] ? h : "comando";
    if (three) three.go(S.st); render(); scrollTo({ top: 0, behavior: STILL ? "auto" : "smooth" });
  }
  addEventListener("hashchange", route);
  route();
  setInterval(() => { if (!dlg.open) schedule(); }, 60000);

  /* =================== DADOS =================== */
  (async () => {
    const db = window.claude && await window.claude.use("db");
    if (!db) { S.ready = true; main.innerHTML = ""; const s = el("section", "station"); s.append(head("Observatório", "Entre no claude.ai", "Os agentes, os vídeos e os números aparecem quando você abre o Observatório com sua conta.")); main.append(s); return; }
    DB = db;
    let pend = 4; const done = () => { if (--pend <= 0) S.ready = true; };
    const sub = (name, key) => db.collection(name).onSnapshot(snap => { S[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); done(); schedule(); }, () => { done(); schedule(); });
    sub("agentes", "agentes"); sub("eventos", "eventos"); sub("videos", "videos"); sub("pedidos", "pedidos");
    db.doc("metricas/youtube").onSnapshot(snap => { S.metricas = snap.exists ? snap.data() : null; schedule(); }, () => {});
  })();
})();
</script>
